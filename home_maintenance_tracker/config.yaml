name: Home Maintenance Tracker
version: "0.2.1"
slug: home_maintenance_tracker
description: Material history, attachments, meters, and scheduled home maintenance
url: https://github.com/blancstair/home-maintenance-tracker-ha
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_title: Maintenance
panel_icon: mdi:tools
panel_admin: false
homeassistant_api: true
hassio_role: default
backup: cold
watchdog: http://[HOST]:[PORT:8099]/health
options:
  max_upload_mb: 250
schema:
  max_upload_mb: int(1,2048)
